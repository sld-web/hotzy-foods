<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&amp;family=Work+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #D7263D !important;
            ring: 0 !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e2e2;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#6e5700",
                    "secondary-fixed-dim": "#f1c100",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#410008",
                    "primary-container": "#d7263d",
                    "surface-tint": "#bd0a2e",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f3f3f3",
                    "on-tertiary-fixed-variant": "#00522d",
                    "on-error-container": "#93000a",
                    "secondary-container": "#fecb00",
                    "surface-container": "#eeeeee",
                    "inverse-on-surface": "#f1f1f1",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#00210f",
                    "primary": "#b20028",
                    "surface-variant": "#e2e2e2",
                    "tertiary-container": "#008149",
                    "on-background": "#1b1b1b",
                    "on-secondary-fixed": "#241a00",
                    "inverse-surface": "#303030",
                    "on-tertiary-container": "#d7ffdf",
                    "surface-bright": "#f9f9f9",
                    "outline-variant": "#e4bdbc",
                    "inverse-primary": "#ffb3b2",
                    "on-primary-fixed-variant": "#92001f",
                    "surface-dim": "#dadada",
                    "on-error": "#ffffff",
                    "primary-fixed": "#ffdad9",
                    "on-surface-variant": "#5b403f",
                    "tertiary-fixed-dim": "#69dd96",
                    "background": "#f9f9f9",
                    "surface-white": "#FFFFFF",
                    "surface": "#f9f9f9",
                    "secondary": "#745b00",
                    "chili-red": "#D7263D",
                    "on-surface": "#1b1b1b",
                    "surface-container-highest": "#e2e2e2",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#ffb3b2",
                    "outline": "#906f6e",
                    "on-primary-container": "#fff2f1",
                    "tertiary-fixed": "#86fab0",
                    "fresh-mint": "#3CB371",
                    "golden-glaze": "#FFCC00",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed-variant": "#584400",
                    "tertiary": "#006539",
                    "surface-container-high": "#e8e8e8",
                    "secondary-fixed": "#ffe08b",
                    "on-secondary": "#ffffff",
                    "surface-gray": "#F8F8F8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "margin-desktop": "40px",
                    "container-max": "1200px",
                    "base": "8px",
                    "stack-lg": "32px",
                    "gutter": "24px",
                    "stack-sm": "4px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "display-lg-mobile": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Work Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Work Sans"],
                    "label-sm": ["Work Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "body-md": ["Work Sans"]
            },
            "fontSize": {
                    "display-lg-mobile": ["36px", {"lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-background min-h-screen pb-24">
<!-- Top AppBar (Simplified for Add Flow) -->
<header class="w-full sticky top-0 z-50 bg-surface border-b border-surface-container flex justify-between items-center px-margin-mobile h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">New Product</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">help_outline</span>
</button>
</header>
<main class="px-margin-mobile py-stack-lg space-y-stack-lg max-w-md mx-auto">
<!-- Progress Stepper (Visual Indicator) -->
<div class="flex items-center gap-2 px-2">
<div class="h-1.5 flex-1 bg-chili-red rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Section 1: Product Media -->
<section class="space-y-stack-md">
<div class="flex justify-between items-end">
<h2 class="font-headline-md text-headline-md-mobile">Product Media</h2>
<span class="font-label-sm text-label-sm text-on-surface-variant">2/5 Images</span>
</div>
<div class="grid grid-cols-2 gap-base">
<!-- Uploaded Thumbnail 1 -->
<div class="aspect-square rounded-lg border border-surface-container overflow-hidden relative group">
<img class="w-full h-full object-cover" data-alt="A high-resolution close-up of a vibrant chili-infused gourmet burger with melting cheese and fresh greens. The lighting is dramatic and warm, emphasizing the textures and colors of the food. The background is a clean, modern kitchen setting in light-mode tones. The visual style is bold, high-contrast, and professional." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAK_VdWxZUBmacE5MDE47CmrMijqockszXGSW5W4O7Fq-VlovZ3EP3-8x8lJ1yvANTt8ijfoRmdE1y_sjva_Ekjux3xJShIC6tDr_f0-4f-BxyRYkBBr6NDErRk3MG_dgAi6-KPxKpiQPOqv_723OYMfARuCfJqS4HZted9PUoMxhfgTgU7SLraNayqkwHzmSXdaS8MBSdMg7yO7YSYFjlS6jcNdD2PoDuZ4ieTOV81hNmZ8ILUxuN559yFMM3OghWyLiPy7Yw8UBOL"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-active:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">delete</span>
</div>
</div>
<!-- Uploading State with Progress -->
<div class="aspect-square rounded-lg border border-outline-variant bg-surface-container-low flex flex-col items-center justify-center p-4 space-y-2">
<span class="material-symbols-outlined text-chili-red animate-pulse">cloud_upload</span>
<div class="w-full bg-surface-container-highest h-1 rounded-full overflow-hidden">
<div class="bg-chili-red h-full w-2/3 transition-all duration-500"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Uploading...</span>
</div>
<!-- Add More Trigger -->
<button class="aspect-square rounded-lg border-2 border-dashed border-outline-variant flex flex-col items-center justify-center space-y-2 active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-outline text-3xl">add_a_photo</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Add Media</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant px-1">Upload at least 3 high-quality images for better visibility.</p>
</section>
<!-- Section 2: Basic Information -->
<section class="bg-surface-white rounded-xl p-stack-md border border-surface-container space-y-stack-md">
<h2 class="font-headline-md text-headline-md-mobile flex items-center gap-2">
<span class="material-symbols-outlined text-chili-red">info</span>
                Basic Info
            </h2>
<div class="space-y-4">
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">Product Name</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-on-surface focus:border-chili-red" placeholder="e.g. Signature Spicy Chicken Box" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">Category</label>
<div class="relative">
<select class="w-full h-12 px-4 appearance-none rounded-lg bg-surface border border-outline-variant font-body-md text-on-surface focus:border-chili-red">
<option>Spicy Mains</option>
<option>Sides &amp; Appetizers</option>
<option>Gourmet Sauces</option>
<option>Beverages</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-3 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">Description</label>
<textarea class="w-full p-4 rounded-lg bg-surface border border-outline-variant font-body-md text-on-surface focus:border-chili-red resize-none" placeholder="Describe the flavors, ingredients and heat levels..." rows="4"></textarea>
</div>
</div>
</section>
<!-- Section 3: Pricing & Inventory -->
<section class="bg-surface-white rounded-xl p-stack-md border border-surface-container space-y-stack-md">
<h2 class="font-headline-md text-headline-md-mobile flex items-center gap-2">
<span class="material-symbols-outlined text-chili-red">payments</span>
                Commercials
            </h2>
<div class="grid grid-cols-2 gap-stack-md">
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">Price ($)</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-on-surface" placeholder="0.00" type="number"/>
</div>
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">Stock (Units)</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant font-body-md text-on-surface" placeholder="100" type="number"/>
</div>
</div>
<div class="flex items-center justify-between p-3 bg-fresh-mint/10 rounded-lg border border-fresh-mint/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-fresh-mint" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-tertiary">Live tracking active</span>
</div>
<div class="w-10 h-5 bg-fresh-mint rounded-full relative">
<div class="absolute right-1 top-1 w-3 h-3 bg-white rounded-full"></div>
</div>
</div>
</section>
<!-- Extra: Dietary Badges (Modern Chips) -->
<section class="space-y-stack-md">
<h2 class="font-headline-md text-headline-md-mobile px-1">Dietary Tags</h2>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-chili-red bg-chili-red text-white font-label-md text-label-md flex items-center gap-2 active:scale-95 transition-transform">
                    Spicy
                    <span class="material-symbols-outlined text-[18px]">local_fire_department</span>
</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md active:bg-surface-container-high transition-colors">
                    Vegan
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md active:bg-surface-container-high transition-colors">
                    Gluten-Free
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md active:bg-surface-container-high transition-colors">
                    Sugar-Free
                </button>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-container px-margin-mobile py-4 z-50 flex items-center gap-stack-md">
<button class="flex-1 h-14 rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface active:bg-surface-container-low transition-colors">
            Discard
        </button>
<button class="flex-[2] h-14 rounded-lg bg-chili-red text-white font-label-md text-label-md shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="saveBtn">
<span id="saveText">Save Product</span>
<span class="hidden material-symbols-outlined animate-spin" id="saveLoader">progress_activity</span>
</button>
</div>
<script>
        const saveBtn = document.getElementById('saveBtn');
        const saveText = document.getElementById('saveText');
        const saveLoader = document.getElementById('saveLoader');

        saveBtn.addEventListener('click', () => {
            saveText.classList.add('hidden');
            saveLoader.classList.remove('hidden');
            
            // Simulate API call
            setTimeout(() => {
                saveLoader.classList.add('hidden');
                saveText.innerText = "Success!";
                saveText.classList.remove('hidden');
                saveBtn.classList.replace('bg-chili-red', 'bg-fresh-mint');
                
                setTimeout(() => {
                    saveText.innerText = "Save Product";
                    saveBtn.classList.replace('bg-fresh-mint', 'bg-chili-red');
                }, 2000);
            }, 1500);
        });

        // Simple haptic-like feedback on touch inputs
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
</body></html>
